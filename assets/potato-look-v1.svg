<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 420" font-family="VT323, 'Courier New', Courier, monospace">
  <rect width="1220" height="420" fill="#EFE6D3"/>
  <defs>
    <path id="body" d="M -100,6 C -106,-38 -62,-74 -12,-72 C 38,-70 92,-56 104,-12 C 112,26 82,66 26,71 C -30,76 -94,54 -100,6 Z"/>
    <path id="bodyKE" d="M -92,4 C -98,-40 -58,-70 -8,-68 C 42,-66 88,-50 96,-8 C 102,30 70,64 18,68 C -34,72 -86,50 -92,4 Z"/>
    <clipPath id="clip"><use href="#body"/></clipPath>
    <clipPath id="clipKE"><use href="#bodyKE"/></clipPath>
  </defs>

  <!-- PANEL 1: neutral, the Question -->
  <g transform="translate(20,20)">
    <rect width="275" height="335" rx="26" fill="#000"/>
    <g transform="translate(137,112) scale(0.82)">
      <use href="#body" fill="#A8743F"/>
      <g clip-path="url(#clip)">
        <ellipse cx="22" cy="44" rx="112" ry="62" fill="#5E3A1C" opacity="0.38"/>
        <ellipse cx="-42" cy="-34" rx="58" ry="28" fill="#FFFFFF" opacity="0.07"/>
      </g>
      <ellipse cx="62" cy="22" rx="5" ry="3" fill="#6B4222" transform="rotate(-25 62 22)"/>
      <ellipse cx="-62" cy="34" rx="4" ry="2.5" fill="#6B4222" transform="rotate(15 -62 34)"/>
      <ellipse cx="30" cy="52" rx="4" ry="2.5" fill="#6B4222"/>
      <ellipse cx="-70" cy="-20" rx="3.5" ry="2" fill="#6B4222" transform="rotate(-30 -70 -20)"/>
      <ellipse cx="-28" cy="-14" rx="7" ry="9" fill="#1A120C"/>
      <ellipse cx="22" cy="-17" rx="7" ry="9.5" fill="#1A120C"/>
    </g>
    <text x="137" y="222" text-anchor="middle" font-size="24" fill="#E8DFCB">Ketchup.</text>
    <g font-size="13" fill="#E8DFCB" text-anchor="middle">
      <rect x="18" y="268" width="72" height="32" rx="3" fill="none" stroke="#E8DFCB" stroke-width="2"/>
      <text x="54" y="289">HEINZ</text>
      <rect x="101" y="268" width="72" height="32" rx="3" fill="none" stroke="#E8DFCB" stroke-width="2"/>
      <text x="137" y="289">HUNT'S</text>
      <rect x="184" y="268" width="72" height="32" rx="3" fill="none" stroke="#E8DFCB" stroke-width="2"/>
      <text x="220" y="284" font-size="11">WHATEVER'S</text>
      <text x="220" y="296" font-size="11">THERE</text>
    </g>
  </g>
  <text x="157" y="392" text-anchor="middle" font-size="18" fill="#11100d" letter-spacing="1">NEUTRAL · RUSSET · THE QUESTION</text>

  <!-- PANEL 2: aggrieved -->
  <g transform="translate(320,20)">
    <rect width="275" height="335" rx="26" fill="#000"/>
    <g transform="translate(137,112) scale(0.82)">
      <use href="#body" fill="#A8743F"/>
      <g clip-path="url(#clip)">
        <ellipse cx="22" cy="44" rx="112" ry="62" fill="#5E3A1C" opacity="0.38"/>
        <ellipse cx="-42" cy="-34" rx="58" ry="28" fill="#FFFFFF" opacity="0.07"/>
      </g>
      <ellipse cx="62" cy="22" rx="5" ry="3" fill="#6B4222" transform="rotate(-25 62 22)"/>
      <ellipse cx="-62" cy="34" rx="4" ry="2.5" fill="#6B4222" transform="rotate(15 -62 34)"/>
      <ellipse cx="30" cy="52" rx="4" ry="2.5" fill="#6B4222"/>
      <ellipse cx="-70" cy="-20" rx="3.5" ry="2" fill="#6B4222" transform="rotate(-30 -70 -20)"/>
      <ellipse cx="-28" cy="-11" rx="8" ry="3.2" fill="#1A120C"/>
      <ellipse cx="22" cy="-14" rx="8" ry="3.2" fill="#1A120C"/>
    </g>
    <text x="137" y="222" text-anchor="middle" font-size="22" fill="#E8DFCB">Four hours, forty-five</text>
    <text x="137" y="250" text-anchor="middle" font-size="22" fill="#E8DFCB">minutes. I counted.</text>
  </g>
  <text x="457" y="392" text-anchor="middle" font-size="18" fill="#11100d" letter-spacing="1">AGGRIEVED · OUT OF THE DARK</text>

  <!-- PANEL 3: asleep -->
  <g transform="translate(620,20)">
    <rect width="275" height="335" rx="26" fill="#000"/>
    <g transform="translate(137,112) scale(0.82)" opacity="0.55">
      <use href="#body" fill="#A8743F"/>
      <g clip-path="url(#clip)">
        <ellipse cx="22" cy="44" rx="112" ry="62" fill="#5E3A1C" opacity="0.38"/>
      </g>
      <ellipse cx="62" cy="22" rx="5" ry="3" fill="#6B4222" transform="rotate(-25 62 22)"/>
      <ellipse cx="-62" cy="34" rx="4" ry="2.5" fill="#6B4222" transform="rotate(15 -62 34)"/>
      <ellipse cx="30" cy="52" rx="4" ry="2.5" fill="#6B4222"/>
      <path d="M -36,-12 q 8,6 16,0" fill="none" stroke="#1A120C" stroke-width="3" stroke-linecap="round"/>
      <path d="M 14,-15 q 8,6 16,0" fill="none" stroke="#1A120C" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="757" y="392" text-anchor="middle" font-size="18" fill="#11100d" letter-spacing="1">ASLEEP · 23:00–06:00 · NO LINE</text>

  <!-- PANEL 4: King Edward variety, File unread (eyes to the edge) -->
  <g transform="translate(920,20)">
    <rect width="275" height="335" rx="26" fill="#000"/>
    <g transform="translate(137,112) scale(0.84)">
      <use href="#bodyKE" fill="#C39A6B"/>
      <g clip-path="url(#clipKE)">
        <ellipse cx="18" cy="42" rx="104" ry="58" fill="#7A5230" opacity="0.34"/>
        <ellipse cx="-38" cy="-32" rx="54" ry="26" fill="#FFFFFF" opacity="0.08"/>
        <ellipse cx="50" cy="-30" rx="9" ry="5" fill="#C97C7C" opacity="0.55" transform="rotate(-20 50 -30)"/>
        <ellipse cx="-55" cy="20" rx="7" ry="4" fill="#C97C7C" opacity="0.5" transform="rotate(25 -55 20)"/>
        <ellipse cx="40" cy="45" rx="8" ry="4" fill="#C97C7C" opacity="0.5"/>
      </g>
      <ellipse cx="58" cy="18" rx="4.5" ry="2.8" fill="#7A4E2A" transform="rotate(-25 58 18)"/>
      <ellipse cx="-58" cy="36" rx="4" ry="2.5" fill="#7A4E2A"/>
      <ellipse cx="-18" cy="-12" rx="6.5" ry="8.5" fill="#1A120C"/>
      <ellipse cx="32" cy="-14" rx="6.5" ry="9" fill="#1A120C"/>
    </g>
    <text x="137" y="222" text-anchor="middle" font-size="22" fill="#E8DFCB">Clive was picked up.</text>
    <text x="137" y="250" text-anchor="middle" font-size="22" fill="#E8DFCB">At two in the afternoon.</text>
  </g>
  <text x="1057" y="392" text-anchor="middle" font-size="18" fill="#11100d" letter-spacing="1">KING EDWARD · FILE UNREAD · GLANCE</text>
</svg>
