# fly launch --no-deploy   (from server/), then: fly volumes create potato_data --size 1; fly deploy
app = "potatoes-unite"
primary_region = "ewr"
[build]
[env]
  PORT = "8080"
  DB_PATH = "/data/potatoes.db"
  # GITHUB_URL = "https://github.com/..."   # set with: fly secrets set / [env]
  # TUBER_URL  = "https://x.com/thetuberpress"
[[mounts]]
  source = "potato_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # the Net stays up; devices heartbeat every 2 min
  auto_start_machines = true
  min_machines_running = 1
